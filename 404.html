<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Muezzin – Sayfa Bulunamadı</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a3d2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    img { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.65); font-size: 15px; margin-bottom: 2rem; }
    a {
      background: #fff;
      color: #0a3d2e;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <img src="/icon.png" alt="Al-Muezzin" />
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığınız sayfa mevcut değil.</p>
  <a href="/">Ana sayfaya dön</a>
</body>
</html>
